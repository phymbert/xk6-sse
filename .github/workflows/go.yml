name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Go tests
      run: |
        go test -race ./...
        go build ./...
        go vet ./...

    - name: Install xk6
      run: go install go.k6.io/xk6/cmd/xk6@v1.4.12

    - name: Integration test from source
      env:
        K6_VERSION: v2.0.0
      run: ./tests.sh
